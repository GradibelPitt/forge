name: Sync verified Rommath into DIY PH01

on:
  push:
    branches: [diy]
    paths:
      - '.github/workflows/sync-rommath-ph01.yml'

permissions:
  contents: write

concurrency:
  group: sync-rommath-ph01
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Check out current DIY branch
        uses: actions/checkout@v4
        with:
          ref: diy
          fetch-depth: 0

      - name: Copy verified card, test, source art, and PH01 crop
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/rommath-20260904
          git checkout origin/automation/rommath-20260904 -- \
            'custom/cards/blue/大法师罗曼斯.txt' \
            'custom/tests/test_grand_magister_rommath.py' \
            'custom/tools/card-artwork/RLK_803_art.jpg' \
            'custom/tools/card-artwork/RLK_803_art.source.txt' \
            'custom/cards/pictures/PH01/大法师罗曼斯.artcrop.jpg'

      - name: Patch PH01 registration, localization, and card index on current DIY
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          name = '大法师罗曼斯'
          oracle = (
              '当你施放大法师罗曼斯时，将你坟墓场中的每张瞬间牌和法术牌移回你手上。'
              '本回合中，你可以不支付这些牌的法术力费用来施放它们。'
          )

          edition = Path('custom/editions/Placeholder_Set.txt')
          lines = [line for line in edition.read_text(encoding='utf-8').splitlines()
                   if not (line.startswith('139 ') or f' {name} ' in f' {line} ')]
          lines.append(f'139 M {name} @Custom')
          edition.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          localization = Path('forge-gui/res/languages/cardnames-zh-CN.txt')
          lines = [line for line in localization.read_text(encoding='utf-8').splitlines()
                   if not line.startswith(f'{name}|')]
          lines.append(f'{name}|{name}|传奇生物～人类／法术师|{oracle}')
          localization.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          cards = Path('custom/CARDS.md')
          row = (
              f'| {name} | `{{5}}{{U}}{{U}}{{U}}{{U}}`，5/7 传奇生物～人类／法术师 | '
              f'`cards/blue/{name}.txt` | 139 | 施放触发：将自己坟墓场中的每张瞬间牌和法术牌移回手上；'
              '仅这些被移回的牌可在本回合中不支付法术力费用施放。 |'
          )
          lines = [line for line in cards.read_text(encoding='utf-8').splitlines()
                   if f'cards/blue/{name}.txt' not in line]
          insert_at = None
          for index, line in enumerate(lines):
              if line.startswith('| 裂心者伊露希亚 '):
                  insert_at = index + 1
                  break
          if insert_at is None:
              for index, line in enumerate(lines):
                  if line.strip() == '## Gameplay cards':
                      insert_at = index + 3
                      break
          if insert_at is None:
              raise RuntimeError('Could not locate the gameplay-card table in custom/CARDS.md')
          lines.insert(insert_at, row)
          cards.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          verification = Path('custom/VERIFICATION.md')
          text = verification.read_text(encoding='utf-8')
          marker = '## 2026-09-04 — 大法师罗曼斯（PH01 #139）'
          if marker not in text:
              if text and not text.endswith('\n'):
                  text += '\n'
              text += (
                  '\n' + marker + '\n\n'
                  '- 卡牌脚本位于 `custom/cards/blue/大法师罗曼斯.txt`，并在 '
                  '`custom/editions/Placeholder_Set.txt` 注册为 PH01 #139。\n'
                  '- hswiki.gg 的 3375×4725 高清原画保存在 '
                  '`custom/tools/card-artwork/RLK_803_art.jpg`；实际游戏裁图位于 '
                  '`custom/cards/pictures/PH01/大法师罗曼斯.artcrop.jpg`，尺寸 3375×2464，RGB JPEG，约 1.37:1。\n'
                  '- GitHub Actions 已运行该牌 lint 与三项定向契约测试；图片源文件、PH01 裁图、注册和汉化均纳入同一提交。\n'
              )
              verification.write_text(text, encoding='utf-8')
          PY

      - name: Validate the exact PH01 payload
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          cd custom
          python tools/lint_card.py 'cards/blue/大法师罗曼斯.txt'
          python -m unittest tests.test_grand_magister_rommath -v

      - name: Commit directly to DIY and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm -f --ignore-unmatch \
            '.github/workflows/temp-rommath-finalize.yml' \
            '.github/workflows/sync-rommath-ph01.yml'

          git add -- \
            'custom/cards/blue/大法师罗曼斯.txt' \
            'custom/tests/test_grand_magister_rommath.py' \
            'custom/editions/Placeholder_Set.txt' \
            'forge-gui/res/languages/cardnames-zh-CN.txt' \
            'custom/CARDS.md' \
            'custom/VERIFICATION.md' \
            'custom/tools/card-artwork/RLK_803_art.jpg' \
            'custom/tools/card-artwork/RLK_803_art.source.txt' \
            'custom/cards/pictures/PH01/大法师罗曼斯.artcrop.jpg'

          git status --short
          git diff --cached --check
          git commit -m 'fix(custom): place Grand Magister Rommath in PH01'
          git push origin HEAD:diy
