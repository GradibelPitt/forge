name: Publish Dragon Breaths artwork

on: [push]

concurrency:
  group: dragon-breaths-automation
  cancel-in-progress: true

jobs:
  publish_art:
    if: github.ref == 'refs/heads/automation/dragon-breaths-20260905'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout authoritative diy picture tree
        uses: actions/checkout@v4
        with:
          ref: diy
          fetch-depth: 1
          sparse-checkout: |
            custom/cards/pictures/PH01
          sparse-checkout-cone-mode: false

      - name: Install image helpers
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pillow requests

      - name: Download exact labeled source art and crop
        shell: python
        run: |
          from __future__ import annotations
          import hashlib
          import io
          from pathlib import Path
          import requests
          from PIL import Image

          API = 'https://warcraft.wiki.gg/api.php'
          UA = 'GradibelPitt-Forge-DIY/1.0 (art synchronization)'
          OUT = Path('custom/cards/pictures/PH01')
          OUT.mkdir(parents=True, exist_ok=True)
          TARGET = (1024, 748)
          EXPECTED = {
              '龙鳞祭司': ('Cleric of Scales HS.jpg', (900, 1200), 0.42),
              '奥术吐息': ('Arcane Breath HS.jpg', (1024, 831), 0.50),
              '梦境吐息': ('Breath of Dreams HS.jpg', (1022, 826), 0.50),
          }

          session = requests.Session()
          session.headers.update({'User-Agent': UA})

          def file_url(filename: str) -> str:
              params = {
                  'action': 'query',
                  'format': 'json',
                  'prop': 'imageinfo',
                  'iiprop': 'url',
                  'titles': f'File:{filename}',
              }
              r = session.get(API, params=params, timeout=30)
              r.raise_for_status()
              data = r.json()
              page = next(iter(data['query']['pages'].values()))
              info = page.get('imageinfo')
              if not info:
                  raise RuntimeError(f'No imageinfo returned for {filename}: {data}')
              return info[0]['url']

          def crop_to_target(im: Image.Image, focus_y: float) -> Image.Image:
              tw, th = TARGET
              target_ratio = tw / th
              w, h = im.size
              src_ratio = w / h
              if src_ratio > target_ratio:
                  crop_w = round(h * target_ratio)
                  left = max(0, min(w - crop_w, round((w - crop_w) / 2)))
                  box = (left, 0, left + crop_w, h)
              else:
                  crop_h = round(w / target_ratio)
                  center_y = round(h * focus_y)
                  top = max(0, min(h - crop_h, center_y - crop_h // 2))
                  box = (0, top, w, top + crop_h)
              return im.crop(box).resize(TARGET, Image.Resampling.LANCZOS)

          for card, (filename, expected_size, focus_y) in EXPECTED.items():
              url = file_url(filename)
              r = session.get(url, timeout=60)
              r.raise_for_status()
              with Image.open(io.BytesIO(r.content)) as raw:
                  raw.load()
                  actual = raw.size
                  if actual != expected_size:
                      raise RuntimeError(f'{filename}: expected {expected_size}, got {actual}')
                  out_im = crop_to_target(raw.convert('RGB'), focus_y)
              out_path = OUT / f'{card}.artcrop.jpg'
              out_im.save(out_path, 'JPEG', quality=94, subsampling=0, optimize=True)
              with Image.open(out_path) as check:
                  check.verify()
              with Image.open(out_path) as check:
                  if check.format != 'JPEG' or check.size != TARGET:
                      raise RuntimeError(f'{out_path}: invalid output {check.format} {check.size}')
              print(f'ART_OK {card} source={actual} output={TARGET} sha256={hashlib.sha256(out_path.read_bytes()).hexdigest()}')

      - name: Commit only the three authoritative art crops
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'custom/cards/pictures/PH01/龙鳞祭司.artcrop.jpg' 'custom/cards/pictures/PH01/奥术吐息.artcrop.jpg' 'custom/cards/pictures/PH01/梦境吐息.artcrop.jpg'
          git status --short
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Artwork already matches diy; nothing to commit.'
            exit 0
          }
          git commit -m 'art(custom): add Dragon Behold trio artwork'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:diy
          exit $LASTEXITCODE
