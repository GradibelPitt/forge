name: Dragon Breaths art probe

on: [push]

concurrency:
  group: dragon-breaths-automation
  cancel-in-progress: true

jobs:
  art_probe:
    if: github.ref == 'refs/heads/automation/dragon-breaths-20260905'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout diy source
        uses: actions/checkout@v4
        with:
          ref: diy
          fetch-depth: 1
      - name: Install Pillow
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pillow
      - name: Inspect PH01 artcrop dimensions
        shell: python
        run: |
          from collections import Counter
          from pathlib import Path
          from PIL import Image
          files = sorted(Path('custom/cards/pictures/PH01').glob('*.artcrop.jpg'))
          counts = Counter()
          ratios = Counter()
          for p in files:
              with Image.open(p) as im:
                  w, h = im.size
              counts[(w, h)] += 1
              ratios[round(w / h, 4)] += 1
          print('ARTCROP_COUNT=', len(files))
          print('TOP_SIZES=', counts.most_common(20))
          print('TOP_RATIOS=', ratios.most_common(20))
          for p in files[-20:]:
              with Image.open(p) as im:
                  print('SAMPLE', p.name, im.size, round(im.width/im.height,4))
